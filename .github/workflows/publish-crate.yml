name: Prepare or publish reviewed Rust crate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare evidence or explicitly publish reviewed bytes
        type: choice
        options: [prepare, publish, automatic]
        default: prepare
        required: true
      source_tag:
        description: Reviewed published source tag
        type: string
        default: v2.8.0
        required: true
      source_revision:
        description: Exact reviewed source revision
        type: string
        default: a47537790f5ea8a08adf7e6dffee4fa794cf3665
        required: true
      source_release_id:
        description: Automatic source release ID
        type: string
        required: false
      manifest_sha256:
        description: Exact automatic release manifest digest
        type: string
        required: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: protocol-crate-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'atrinik/protocol' && github.repository_id == '1327106950' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_HOME: /tmp/atrinik-crate-prepare-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-crate-prepare-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          python3 tools/crate_publication.py prepare --source-tag "$SOURCE_TAG" \
            --source-revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/crate-prepared"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-crate-inputs
          path: |
            ${{ runner.temp }}/crate-prepared/atrinik-protocol-0.2.0.crate
            ${{ runner.temp }}/crate-prepared/artifact.json
          if-no-files-found: error
          retention-days: 7

  verify:
    if: github.repository == 'atrinik/protocol' && github.repository_id == '1327106950' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.verify.outputs.ready_for_upload }}
    env:
      CARGO_HOME: /tmp/atrinik-crate-verify-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-crate-verify-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - id: verify
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          python3 tools/crate_publication.py verify-publish --source-tag "$SOURCE_TAG" \
            --source-revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/crate-verified"

  publish:
    needs: verify
    if: github.repository == 'atrinik/protocol' && github.repository_id == '1327106950' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && needs.verify.outputs.ready == 'true'
    environment: crates-io-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          python3 tools/crate_publication.py verify-upload --source-tag "$SOURCE_TAG" \
            --source-revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/crate-verified"
      - id: auth
        if: steps.verify.outputs.ready_for_upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - id: upload
        if: steps.verify.outputs.ready_for_upload == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE_PUBLICATION_OPERATION: publish
        run: python3 tools/crate_upload.py --crate "$RUNNER_TEMP/crate-verified/atrinik-protocol-0.2.0.crate"
      - if: ${{ !cancelled() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        run: python3 tools/crate_publication.py verify-registry

  automatic-verify:
    if: github.repository == 'atrinik/protocol' && github.repository_id == '1327106950' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'automatic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_READ_TOKEN: ${{ github.token }}
      SOURCE_RELEASE_ID: ${{ inputs.source_release_id }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: >-
          python3 tools/crate_release.py verify --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"

  automatic-publish:
    needs: automatic-verify
    if: github.repository == 'atrinik/protocol' && github.repository_id == '1327106950' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'automatic'
    environment: crates-io-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GH_READ_TOKEN: ${{ github.token }}
      SOURCE_RELEASE_ID: ${{ inputs.source_release_id }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: >-
          python3 tools/crate_release.py verify --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - id: upload
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          python3 tools/crate_release.py upload --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"
      - if: ${{ !cancelled() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        run: >-
          python3 tools/crate_release.py confirm --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"
