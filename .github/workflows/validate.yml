name: Protocol validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: protocol-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Protocol validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUF_CACHE_DIR: /tmp/atrinik-protocol-buf-cache
      CARGO_HOME: /tmp/atrinik-protocol-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-protocol-target
      GOCACHE: /tmp/atrinik-protocol-go-build
      GOMODCACHE: /tmp/atrinik-protocol-go-modules
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true

      - name: Install pinned validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gcc-mingw-w64-x86-64 ripgrep unzip
          tools/install-ci-dependencies.sh

      - name: Validate schemas, bindings, consumers, and release
        run: tools/validate.sh
