name: Release protocol contracts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Release protocol contracts
    runs-on: ubuntu-24.04
    container: ghcr.io/atrinik/linux-build:ubuntu-26.04@sha256:6e128d58125dfa0f4553c112ba76616f84aa448728dfc0fc235eb52a1024a53d
    timeout-minutes: 20
    env:
      BUF_CACHE_DIR: /tmp/atrinik-protocol-buf-cache
      CARGO_HOME: /tmp/atrinik-protocol-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-protocol-target
      GH_TOKEN: ${{ github.token }}
      GOCACHE: /tmp/atrinik-protocol-go-build
      GOMODCACHE: /tmp/atrinik-protocol-go-modules
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! ${GITHUB_REF_NAME} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Validate and package
        run: |
          tools/validate.sh
          tools/package-release.sh dist

      - name: Publish immutable GitHub release
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --generate-notes
