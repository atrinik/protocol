name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: protocol-semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release protocol contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUF_CACHE_DIR: /tmp/atrinik-protocol-buf-cache
      CARGO_HOME: /tmp/atrinik-protocol-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-protocol-target
      GOCACHE: /tmp/atrinik-protocol-go-build
      GOMODCACHE: /tmp/atrinik-protocol-go-modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Install pinned release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gcc-mingw-w64-x86-64 ripgrep unzip
          tools/install-ci-dependencies.sh
      - name: Revalidate exact release revision
        run: tools/validate.sh
      - name: Verify release branch policy
        run: node scripts/release/test-release-policy.cjs
      - name: Analyze commits, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          semantic-release
