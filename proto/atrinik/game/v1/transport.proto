syntax = "proto3";

package atrinik.game.v1;

import "atrinik/game/v1/common.proto";

option go_package = "github.com/atrinik/protocol/gen/go/atrinik/game/v1;gamev1";

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_CONTROL_V1 = 1;
  CAPABILITY_GAMEPLAY_V1 = 2;
  CAPABILITY_RESOURCE_V1 = 3;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_LINUX = 1;
  PLATFORM_WINDOWS = 2;
}

enum StreamRole {
  STREAM_ROLE_UNSPECIFIED = 0;
  STREAM_ROLE_CONTROL = 1;
  STREAM_ROLE_ACTIONS = 2;
  STREAM_ROLE_STATE = 3;
  STREAM_ROLE_RESOURCE = 4;
}

enum ErrorClass {
  ERROR_CLASS_UNSPECIFIED = 0;
  ERROR_CLASS_TRANSPORT = 1;
  ERROR_CLASS_AUTHENTICATION = 2;
  ERROR_CLASS_PROTOCOL = 3;
  ERROR_CLASS_CONTENT = 4;
  ERROR_CLASS_RESOURCE = 5;
  ERROR_CLASS_REQUEST = 6;
  ERROR_CLASS_INTERNAL = 7;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VERSION_UNSUPPORTED = 1;
  ERROR_CODE_CAPABILITY_REQUIRED = 2;
  ERROR_CODE_MALFORMED_FRAME = 3;
  ERROR_CODE_FRAME_TOO_LARGE = 4;
  ERROR_CODE_STREAM_ROLE_INVALID = 5;
  ERROR_CODE_MESSAGE_OUT_OF_STATE = 6;
  ERROR_CODE_IDENTITY_CHANGED = 7;
  ERROR_CODE_AUTHENTICATION_FAILED = 8;
  ERROR_CODE_RATE_LIMITED = 9;
  ERROR_CODE_SERVER_DRAINING = 10;
  ERROR_CODE_INTERNAL = 11;
}

message StreamHeader {
  StreamRole role = 1;
  uint32 epoch = 2;
}

message ClientHello {
  ProtocolVersion version = 1;
  repeated Capability capabilities = 2;
  string locale = 3;
  Platform platform = 4;
  string build_id = 5;
  bytes client_nonce = 6;
}

message ServerHello {
  ProtocolVersion version = 1;
  repeated Capability capabilities = 2;
  SessionId session_id = 3;
  Digest256 server_identity = 4;
  uint32 maximum_gameplay_frame_bytes = 5;
  uint32 maximum_resource_frame_bytes = 6;
  DurationMillis idle_timeout = 7;
}

message ConnectionRejected {
  ErrorClass error_class = 1;
  ErrorCode code = 2;
  DiagnosticId diagnostic_id = 3;
  string safe_message = 4;
  bool retryable = 5;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message GracefulDrain {
  DurationMillis deadline = 1;
  string safe_reason = 2;
}

message ControlEnvelope {
  uint64 sequence = 1;
  oneof payload {
    ClientHello client_hello = 2;
    ServerHello server_hello = 3;
    ConnectionRejected rejected = 4;
    Ping ping = 5;
    Pong pong = 6;
    GracefulDrain drain = 7;
  }
}
